<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Therapy Assistant - Your Safe Space</title>
    <link rel="stylesheet" href="/static/styles/landing.css?v=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="landing-background">
        <!-- Soft background illustration elements -->
        <div class="bg-decoration">
            <div class="leaf leaf-1">🍃</div>
            <div class="leaf leaf-2">🍃</div>
            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>
            <div class="wave-line wave-line-1"></div>
            <div class="wave-line wave-line-2"></div>
        </div>
    </div>

    <div class="landing-container">
        <!-- Top right atmosphere element -->
        <div class="atmosphere-text">
            "You've already taken the first step toward change, and I'll be here with you."
        </div>

        <!-- Title section -->
        <header class="landing-header">
            <h1 class="landing-title">🌿 CBT Therapy Assistant</h1>
            <p class="landing-subtitle">Today, let's take care of your feelings together</p>
            <div class="title-decoration"></div>
        </header>

        <!-- Middle button section -->
        <div class="button-section">
            <button id="startRecordBtn" class="btn-primary">
                <span class="btn-icon">📝</span>
                <span class="btn-main-text">Start Today's Record</span>
                <span class="btn-sub-text">This is your safe space</span>
            </button>

            <button id="guideBtn" class="btn-secondary">
                <span class="btn-text">Diary Guide</span>
            </button>
            <p class="guide-hint">Don't know where to start? That's okay, I'll guide you step by step.</p>
        </div>

        <!-- Bottom right info section -->
        <div class="footer-info">
            <span class="version">v0.3.1 Beta</span>
            <span class="separator">|</span>
            <a href="#" class="footer-link">GitHub</a>
            <span class="separator">|</span>
            <a href="#" class="footer-link">⚙ Settings</a>
        </div>
    </div>

    <script src="/static/components/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const startRecordBtn = document.getElementById('startRecordBtn');
            const guideBtn = document.getElementById('guideBtn');

            // Start today's record - navigate to chat interface and auto-start
            if (startRecordBtn) {
                startRecordBtn.addEventListener('click', function() {
                    window.location.href = '/chat';
                });
            }

            // Diary guide button - show guide content
            if (guideBtn) {
                guideBtn.addEventListener('click', function() {
                    showGuideModal();
                });
            }
        });

        function showGuideModal() {
            // Create modal overlay
            const modalOverlay = document.createElement('div');
            modalOverlay.className = 'modal-overlay';
            modalOverlay.id = 'guideModal';
            
            // Create modal content
            const modalContent = document.createElement('div');
            modalContent.className = 'modal-content';
            
            modalContent.innerHTML = `
                <div class="modal-header">
                    <h2>📝 How to Record Your Thoughts and Feelings Gently and Effectively</h2>
                    <button class="modal-close" onclick="closeGuideModal()">×</button>
                </div>
                <div class="modal-body">
                    <p class="guide-intro">
                        Keeping a CBT-style daily diary is not about being perfect or writing a long essay.<br>
                        It's simply a way to gently check in with yourself, understand your feelings, and see patterns that might be affecting your mood.<br>
                        There is no right or wrong way to write—your diary is your safe and private space.
                    </p>

                    <p class="guide-structure-title">Here is a simple structure you can follow:</p>

                    <div class="guide-section">
                        <h3>1. What happened today?</h3>
                        <p>Start with a brief description of something that affected you emotionally—big or small.</p>
                        <p>It might be something that made you upset, anxious, lonely, overwhelmed, guilty, ashamed, or just "not yourself."</p>
                        <div class="guide-examples">
                            <strong>Examples:</strong>
                            <ul>
                                <li>"I woke up feeling empty and heavy."</li>
                                <li>"I had a difficult interaction at work."</li>
                                <li>"I felt anxious when I thought about tomorrow."</li>
                            </ul>
                        </div>
                        <p class="guide-note">Don't worry about details—just describe the part that matters to you.</p>
                    </div>

                    <div class="guide-section">
                        <h3>2. What emotions did you feel?</h3>
                        <p>Name the emotions you experienced and rate their intensity (0–100).</p>
                        <p>This helps you understand how strongly the situation impacted you.</p>
                        <div class="guide-examples">
                            <strong>Examples:</strong>
                            <ul>
                                <li>Anxiety — 70/100</li>
                                <li>Sadness — 80/100</li>
                                <li>Anger — 40/100</li>
                                <li>Shame — 65/100</li>
                            </ul>
                        </div>
                        <p class="guide-note">You can feel more than one emotion at the same time. That is completely normal.</p>
                    </div>

                    <div class="guide-section">
                        <h3>3. What happened in your body?</h3>
                        <p>CBT pays attention to physical reactions because they tell us how our nervous system is responding.</p>
                        <div class="guide-examples">
                            <strong>Examples:</strong>
                            <ul>
                                <li>tight chest</li>
                                <li>shaky hands</li>
                                <li>stomach discomfort</li>
                                <li>fast heartbeat</li>
                                <li>numbness</li>
                                <li>fatigue</li>
                            </ul>
                        </div>
                        <p class="guide-note">Just describe whatever you noticed.</p>
                    </div>

                    <div class="guide-section">
                        <h3>4. What thoughts went through your mind?</h3>
                        <p>These are your automatic thoughts—the first things that popped up.</p>
                        <div class="guide-examples">
                            <strong>Examples:</strong>
                            <ul>
                                <li>"I can't handle this."</li>
                                <li>"People will judge me."</li>
                                <li>"I'm not good enough."</li>
                                <li>"Everything will go wrong."</li>
                            </ul>
                        </div>
                        <p class="guide-note">There is no need to judge these thoughts. We're simply observing them.</p>
                    </div>

                    <div class="guide-section">
                        <h3>5. How did you react or behave?</h3>
                        <p>Describe what you did in response to the situation or feelings.</p>
                        <div class="guide-examples">
                            <strong>Examples:</strong>
                            <ul>
                                <li>I withdrew from others</li>
                                <li>I avoided answering messages</li>
                                <li>I cried</li>
                                <li>I distracted myself with my phone</li>
                                <li>I froze and couldn't decide what to do</li>
                            </ul>
                        </div>
                        <p class="guide-note">These reactions help us understand your coping patterns.</p>
                    </div>

                    <div class="guide-section">
                        <h3>6. What happened afterward? (Consequences)</h3>
                        <p>This helps identify whether the behavior helped or made things harder.</p>
                        <div class="guide-examples">
                            <strong>Examples:</strong>
                            <ul>
                                <li>"I felt even more anxious afterward."</li>
                                <li>"I calmed down a bit, but the worry came back later."</li>
                                <li>"I felt guilty for avoiding the situation."</li>
                            </ul>
                        </div>
                        <p class="guide-note">There is no judgment here—just clarity.</p>
                    </div>

                    <div class="guide-section">
                        <h3>7. What would you like to change or understand better?</h3>
                        <p>This part helps set gentle goals for the future.</p>
                        <div class="guide-examples">
                            <strong>Examples:</strong>
                            <ul>
                                <li>"I want to reduce my anxiety in social situations."</li>
                                <li>"I want to understand why I feel empty."</li>
                                <li>"I want to stop blaming myself for everything."</li>
                            </ul>
                        </div>
                        <p class="guide-note">This becomes the foundation of your therapeutic progress.</p>
                    </div>

                    <div class="guide-reminder">
                        <h3>🌱 A Gentle Reminder</h3>
                        <p>Your diary is not an assignment.</p>
                        <p>It's a conversation with yourself.</p>
                        <p>You are allowed to:</p>
                        <ul>
                            <li>write slowly</li>
                            <li>write simply</li>
                            <li>write imperfectly</li>
                            <li>write only one sentence</li>
                            <li>write a lot</li>
                            <li>skip days</li>
                        </ul>
                        <p class="guide-final">What matters is honesty, not perfection.</p>
                        <p class="guide-final">You're already doing something brave by checking in with your emotions.</p>
                        <p class="guide-final">Take it one step at a time. You're not alone.</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-modal-close" onclick="closeGuideModal()">Got it, thank you</button>
                </div>
            `;
            
            modalOverlay.appendChild(modalContent);
            document.body.appendChild(modalOverlay);
            
            // Add fade-in animation
            setTimeout(() => {
                modalOverlay.classList.add('show');
            }, 10);
            
            // Close on background click
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    closeGuideModal();
                }
            });
        }

        function closeGuideModal() {
            const modal = document.getElementById('guideModal');
            if (modal) {
                modal.classList.remove('show');
                setTimeout(() => {
                    modal.remove();
                }, 300);
            }
        }
    </script>
</body>
</html>
